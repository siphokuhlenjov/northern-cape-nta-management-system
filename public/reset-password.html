<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reset password | Northern Cape NTA</title>
    <link rel="stylesheet" href="/assets/css/main.css">
    <style>
      body {
        margin: 0;
        background: #f4f7f3;
        color: #1e2b27;
      }
      .auth-shell {
        max-width: 560px;
        margin: 64px auto;
        padding: 0 20px;
      }
      .auth-card {
        background: #fff;
        border: 1px solid #e3e8e0;
        border-radius: 12px;
        padding: 32px 28px;
        box-shadow: 0 18px 45px rgba(18, 59, 50, 0.08);
      }
      .eyebrow {
        display: inline-block;
        font-size: 10px;
        letter-spacing: .16em;
        font-weight: 800;
        color: #6e826f;
        margin-bottom: 12px;
      }
      h1 {
        margin: 0 0 10px;
        font-size: clamp(2rem, 4vw, 2.5rem);
        letter-spacing: -0.04em;
      }
      .helper {
        color: #6a7d73;
        font-size: 12px;
        margin-top: 14px;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-top: 18px;
      }
      .field label {
        font-size: 12px;
        font-weight: 700;
      }
      .field input {
        width: 100%;
        border: 1px solid #cfd9d1;
        border-radius: 8px;
        padding: 12px 14px;
        font: inherit;
        color: #1e2b27;
      }
      .actions {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-top: 24px;
        flex-wrap: wrap;
      }
      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 46px;
        padding: 0 18px;
        border: 0;
        border-radius: 6px;
        background: #123b32;
        color: #fff;
        font-size: 12px;
        font-weight: 800;
        cursor: pointer;
      }
      .text-link {
        font-size: 12px;
        font-weight: 700;
        color: #1b5d4a;
      }
      .success {
        color: #1d6032;
        font-weight: 600;
      }
      @media (max-width: 640px) {
        .auth-shell {
          margin: 36px auto;
        }
        .auth-card {
          padding: 24px 18px;
        }
        .actions {
          align-items: flex-start;
          flex-direction: column;
        }
      }

      .pw-wrap { position: relative; display: flex; }
      .pw-wrap input { padding-right: 64px; }
      .pw-toggle { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); border: 0; background: #e7eee8; color: #123b32; font-weight: 700; font-size: 11px; border-radius: 6px; padding: 6px 9px; cursor: pointer; }
      .error-text { color: #a3321f; font-weight: 600; }
    </style>
  </head>
  <body>
    <header class="header">
      <div class="wrap nav">
        <a class="brand" href="/">
          <span class="brand-mark">NC</span>
          <span>
            <strong>Northern Cape NTA</strong>
            <small>Digital Management System</small>
          </span>
        </a>
        <nav>
          <a href="/">Home</a>
          <a href="/#workspace">Sign in</a>
        </nav>
      </div>
    </header>

    <main class="auth-shell">
      <div class="auth-card">
        <div class="eyebrow">ACCOUNT ACCESS</div>
        <h1>Reset password</h1>
        <p class="helper">Choose a new password for your account. It must have at least 12 characters, including letters and numbers.</p>

        <form id="resetForm" novalidate>
          <div class="field">
            <label for="newPassword">New password</label>
            <div class="pw-wrap">
              <input id="newPassword" name="password" type="password" required autocomplete="new-password" maxlength="72">
              <button type="button" class="pw-toggle" data-toggle="newPassword">Show</button>
            </div>
          </div>
          <div class="field">
            <label for="confirmNewPassword">Confirm new password</label>
            <div class="pw-wrap">
              <input id="confirmNewPassword" name="confirmPassword" type="password" required autocomplete="new-password" maxlength="72">
              <button type="button" class="pw-toggle" data-toggle="confirmNewPassword">Show</button>
            </div>
          </div>
          <div class="actions">
            <button class="button" type="submit">Update password</button>
            <a class="text-link" href="/#workspace">Back to sign in</a>
          </div>
          <p id="resetStatus" class="helper" aria-live="polite"></p>
        </form>
      </div>
    </main>

    <script>
      const token = new URLSearchParams(location.search).get('token') || '';
      const form = document.getElementById('resetForm');
      const statusEl = document.getElementById('resetStatus');
      const btn = form.querySelector('button[type="submit"]');

      function show(text, ok) {
        statusEl.textContent = text;
        statusEl.className = 'helper ' + (ok ? 'success' : 'error-text');
      }

      document.querySelectorAll('[data-toggle]').forEach(function (b) {
        b.addEventListener('click', function () {
          const input = document.getElementById(b.dataset.toggle);
          const reveal = input.type === 'password';
          input.type = reveal ? 'text' : 'password';
          b.textContent = reveal ? 'Hide' : 'Show';
        });
      });

      if (!/^[a-f0-9]{64}$/.test(token)) {
        show('This reset link is missing or invalid. Please request a new one from the Forgot password page.', false);
        btn.disabled = true;
      }

      form.addEventListener('submit', async function (event) {
        event.preventDefault();
        const data = new FormData(form);
        const password = String(data.get('password') || '');
        const confirmPassword = String(data.get('confirmPassword') || '');
        if (password !== confirmPassword) { show('The two passwords do not match.', false); return; }
        btn.disabled = true;
        const label = btn.textContent;
        btn.textContent = 'Updating…';
        try {
          const res = await fetch('/api/auth/reset-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token, password, confirmPassword })
          });
          let out = {};
          try { out = await res.json(); } catch {}
          if (!res.ok) { show(out.error || 'Could not update the password.', false); btn.disabled = false; btn.textContent = label; return; }
          show((out.message || 'Password updated.') + ' Redirecting to sign in…', true);
          form.reset();
          setTimeout(function () { location.href = '/#workspace'; }, 2500);
        } catch {
          show('Cannot reach the server. Make sure it is running.', false);
          btn.disabled = false;
          btn.textContent = label;
        }
      });
    </script>
  </body>
</html>
